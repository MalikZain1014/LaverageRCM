<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B5ED7" />
    <title>LeverageRCM | Medical Billing & Revenue Cycle Management</title>
    <meta name="description" content="LeverageRCM is a premium medical billing and revenue cycle management partner helping healthcare providers across the USA & UK maximize revenue through accurate billing, coding, credentialing, and complete RCM services." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LeverageRCM | Medical Billing & Revenue Cycle Management" />
    <meta property="og:description" content="Helping Healthcare Providers Across the USA & UK Maximize Revenue Through Accurate Medical Billing, Coding, Credentialing, and Complete Revenue Cycle Management." />
    <meta property="og:url" content="https://leveragercm.com/" />
    <meta property="og:site_name" content="LeverageRCM" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LeverageRCM | Medical Billing & Revenue Cycle Management" />
    <meta name="twitter:description" content="Helping Healthcare Providers Across the USA & UK Maximize Revenue." />

    <!-- Font performance: preconnect then preload stylesheet to avoid render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload stylesheet and swap to stylesheet onload for faster font fetch -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>

    <!-- Inline critical CSS for above-the-fold hero to reduce render delay -->
    <style>
      /* Basic font and background so hero can paint immediately */
      html,body{height:100%;}
      body{margin:0; font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #0a2242; color:#fff;}
      .bg-hero-radial{background-image:radial-gradient(circle at 30% 20%, rgba(11,94,215,0.18), transparent 55%), radial-gradient(circle at 80% 60%, rgba(20,184,166,0.12), transparent 50%);} 
      .container-px{box-sizing:border-box; padding-left:1.25rem; padding-right:1.25rem; max-width:112rem; margin-left:auto; margin-right:auto;}
      h1{margin-top:1.5rem; font-weight:800; line-height:1.1; color:#fff; font-size:2.25rem;}
      @media(min-width:640px){h1{font-size:3rem}}
      @media(min-width:1024px){h1{font-size:3.75rem}}
      @media(min-width:1280px){h1{font-size:4.5rem}}
      /* Ensure reduced-motion users aren't animated */
      @media (prefers-reduced-motion: reduce){.animate-fade-in{animation:none!important}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
